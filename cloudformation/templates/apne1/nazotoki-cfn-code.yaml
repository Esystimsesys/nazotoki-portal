AWSTemplateFormatVersion: "2010-09-09"
Description: >
  nazotoki-portal - IAM role that GitHub Actions assumes via OIDC to deploy
  this project (.github/workflows/deploy.yml). Replaces the former CodeCommit
  + CodeBuild x2 + CodePipeline setup. Not listed in templates.conf.

# Why GitHub Actions instead of CodePipeline:
#   The repository moved to GitHub, and a CodePipeline source needs a
#   CodeConnections connection whose OAuth handshake can only be completed in
#   the console - there is no API for it (the CLI can create the connection,
#   but it stays PENDING). GitHub Actions + OIDC has no such manual step,
#   keeps the pipeline definition in the repo, and drops the CodeBuild and
#   artifact-bucket cost entirely. The workflow does what the pipeline did:
#   typecheck/test -> rain deploy of the app stacks -> Vite build + S3 sync +
#   CloudFront invalidation.
#
# Why this stack is NOT in templates.conf:
#   The workflow runs deploy.sh; if this stack were in that list, every deploy
#   would rewrite the very role the running job is authenticated with. Deploy
#   it from a workstation instead:
#     rain deploy -r ap-northeast-1 templates/apne1/nazotoki-cfn-code.yaml nazotoki-cfn-code
#
# Prerequisites:
#   - The shared JWT secret exists in SSM Parameter Store as a SecureString at
#     /nazotoki/jwt-secret, so it stays stable across deploys (deploy.sh
#     generates a random one when unset - see cloudformation/README.md).
#   - The account already has the GitHub OIDC provider
#     (token.actions.githubusercontent.com). It is referenced, not created:
#     an account can hold only one provider per URL and this one predates
#     this stack.

Parameters:
  GitHubOwner:
    Type: String
    Default: Esystimsesys
    Description: GitHub organization/user that owns the repository.
  GitHubRepo:
    Type: String
    Default: nazotoki-portal
    Description: GitHub repository name.
  GitHubBranch:
    Type: String
    Default: main
    Description: >
      Branch allowed to assume the deploy role. The trust policy pins the OIDC
      subject to this branch, so a workflow running on any other ref (or from
      a fork's pull request) cannot obtain deploy credentials. The owner and
      repository names carry a trailing wildcard because GitHub appends
      numeric org/repo ids to the subject in this organization.

Resources:
  # ---------------------------------------------------------------------
  # Deploy role assumed by GitHub Actions through OIDC.
  #
  # No long-lived access keys are stored in GitHub: the workflow requests a
  # short-lived OIDC token from GitHub and exchanges it for temporary AWS
  # credentials, scoped by the subject condition below.
  # ---------------------------------------------------------------------
  githubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nazotoki-github-actions-deploy-role
      Description: Assumed by GitHub Actions (OIDC) to deploy nazotoki-portal.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # Guards against the "confused deputy" case where some other
                # GitHub workflow presents a token to this role.
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # GitHub が送る sub は、この組織では ID 付きの形になる:
                #   repo:Owner@<orgId>/Repo@<repoId>:ref:refs/heads/main
                # 名前だけで一致させようとすると必ず外れるため、
                # 所有者名とリポジトリ名の直後にワイルドカードを置いて ID 部分を吸収する。
                # ブランチは refs/heads/<branch> で厳密に固定したまま（fork の PR は通さない）。
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}*/${GitHubRepo}*:ref:refs/heads/${GitHubBranch}
      ManagedPolicyArns:
        # AdministratorAccess, same as the CodeBuild backend role it replaces.
        # The deploy creates/updates IAM roles, Lambda, API Gateway, DynamoDB
        # and CloudFront across every stack, so a scoped policy would end up
        # restating the whole template set and drifting from it on each change.
        # Accepted for a single-account internal event system - see
        # cloudformation/README.md "IAM権限の方針".
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  DeployRoleArn:
    Description: Set as the role-to-assume in .github/workflows/deploy.yml
    Value: !GetAtt githubActionsDeployRole.Arn
  GitHubRepository:
    Value: !Sub ${GitHubOwner}/${GitHubRepo}
