AWSTemplateFormatVersion: "2010-09-09"
Description: >
  nazotoki-portal - Frontend S3 bucket (OAC) + CloudFront distribution.
  Simplified from ekiden-portal: there is no separate S3 stack (no documents
  bucket - this app has no file uploads), so the frontend bucket lives in
  this same stack as the distribution that serves it, which sidesteps the
  s3<->cloudfront circular-dependency problem ekiden-portal has to solve
  across two stacks (the bucket policy needs the distribution ARN, the
  distribution needs the bucket's domain name - both are available here in a
  single template). Default behavior serves the SPA from S3 (with a
  CloudFront Function rewriting extensionless requests to /index.html for
  client-side routing); the /api/* behavior proxies to the HTTP API with
  caching disabled and Managed-AllViewerExceptHostHeader (forwards the
  Authorization header used for this project's self-issued JWTs, without
  forwarding the viewer's Host header, which the HTTP API would otherwise
  reject). Depends on the ApiDomainName output of the lambda-api stack.

Parameters:
  ApiDomainName:
    Type: String
    Description: HTTP API bare domain, e.g. abc123.execute-api.ap-northeast-1.amazonaws.com

Resources:
  # ---------------------------------------------------------------------
  # Frontend bucket: SPA static assets, private, read only via CloudFront OAC.
  # ---------------------------------------------------------------------
  frontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub nazotoki-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  # ---------------------------------------------------------------------
  # OAC: S3 origin access via SigV4-signed CloudFront requests only
  # ---------------------------------------------------------------------
  originAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: nazotoki-frontend-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------------------------------------------------------------------
  # SPA routing: viewer-request function rewrites extensionless GET/HEAD
  # requests to /index.html (client-side router). /api/* never reaches this
  # function (attached to the default behavior only), but is guarded anyway.
  # ---------------------------------------------------------------------
  spaRoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: nazotoki-spa-routing
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extensionless requests to /index.html for SPA routing
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.startsWith('/api/')) {
            return request;
          }
          // If the last path segment has no file extension, serve the SPA shell
          var lastSegment = uri.split('/').pop();
          if (!lastSegment.includes('.')) {
            request.uri = '/index.html';
          }
          return request;
        }

  # ---------------------------------------------------------------------
  # Security headers. CSP is narrower than ekiden-portal's: no Cognito
  # Hosted UI form-action, no direct-to-S3 presigned upload connect-src
  # (this app has no file uploads), since auth here is same-origin JWT only.
  # ---------------------------------------------------------------------
  # 見出しの装飾フォント（Cinzel Decorative）と本文の Noto Sans JP を Google Fonts から
  # 読み込むため、style-src に fonts.googleapis.com、font-src に fonts.gstatic.com を許可する。
  # スタイルシートは googleapis から、実体のフォントファイルは gstatic から配信されるため
  # 2つのドメインが要る（片方だけだと読み込みが止まる）。
  securityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: nazotoki-security-headers
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'self';
              script-src 'self';
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              img-src 'self' data:;
              font-src 'self' data: https://fonts.gstatic.com;
              connect-src 'self';
              object-src 'none';
              base-uri 'self';
              form-action 'self';
              frame-ancestors 'none'
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true

  # ---------------------------------------------------------------------
  # Distribution: default behavior -> S3 (SPA), /api/* -> HTTP API.
  # PriceClass_200 for cost minimization per docs/00-design.md.
  # ---------------------------------------------------------------------
  distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: nazotoki-portal (SPA + /api/*)
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        IPV6Enabled: true
        Origins:
          - Id: frontendS3Origin
            DomainName: !GetAtt frontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt originAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: httpApiOrigin
            DomainName: !Ref ApiDomainName
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: frontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref securityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt spaRoutingFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: httpApiOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            # Managed-CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed-AllViewerExceptHostHeader (forwards the Authorization
            # header carrying this project's self-issued JWT; the HTTP API
            # 403s if the viewer's Host - the CloudFront domain - is
            # forwarded verbatim, so it must be excluded)
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref securityHeadersPolicy

  # ---------------------------------------------------------------------
  # Frontend bucket policy: this distribution only, via OAC.
  # ---------------------------------------------------------------------
  frontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref frontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${frontendBucket}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${distribution}

Outputs:
  DistributionId:
    Value: !Ref distribution
  DistributionDomainName:
    Value: !GetAtt distribution.DomainName
  AppUrl:
    Description: Public CloudFront URL for the app
    Value: !Sub https://${distribution.DomainName}
  FrontendBucketName:
    Value: !Ref frontendBucket
